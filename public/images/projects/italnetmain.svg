<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Italnet IT and electronic solutions landing preview">
  <defs>
    <linearGradient id="i-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#050608"/>
      <stop offset="100%" stop-color="#0b0c11"/>
    </linearGradient>
    <radialGradient id="i-glow" cx="0.35" cy="0.5" r="0.55">
      <stop offset="0%"  stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="i-glow-line">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#i-bg)"/>
  <rect width="1600" height="1000" fill="url(#i-glow)"/>

  <!-- PCB-style grid -->
  <g opacity="0.06" stroke="#00ff88">
    <line x1="0" y1="100" x2="700" y2="100" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="700" y2="200" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="700" y2="300" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="700" y2="400" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="700" y2="500" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="700" y2="600" stroke-width="0.5"/>
    <line x1="0" y1="700" x2="700" y2="700" stroke-width="0.5"/>
    <line x1="0" y1="800" x2="700" y2="800" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="1000" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="1000" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="1000" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="1000" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="1000" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="1000" stroke-width="0.5"/>
  </g>

  <!-- ───── LEFT: CIRCUIT BOARD diagram ───── -->
  <g transform="translate(100 200)" stroke="#00ff88" stroke-width="2" fill="none">

    <!-- Main CPU square (center) -->
    <rect x="240" y="240" width="120" height="120" rx="6" fill="rgba(0,255,136,0.06)" stroke="#00ff88" stroke-width="2" filter="url(#i-glow-line)"/>
    <text x="300" y="305" text-anchor="middle" font-family="'SF Mono',monospace" font-size="14" font-weight="700" fill="#00ff88">CPU</text>
    <!-- CPU pins -->
    <g stroke="#00ff88" stroke-width="1.5">
      <line x1="240" y1="270" x2="220" y2="270"/><line x1="240" y1="290" x2="220" y2="290"/>
      <line x1="240" y1="310" x2="220" y2="310"/><line x1="240" y1="330" x2="220" y2="330"/>
      <line x1="360" y1="270" x2="380" y2="270"/><line x1="360" y1="290" x2="380" y2="290"/>
      <line x1="360" y1="310" x2="380" y2="310"/><line x1="360" y1="330" x2="380" y2="330"/>
      <line x1="270" y1="240" x2="270" y2="220"/><line x1="290" y1="240" x2="290" y2="220"/>
      <line x1="310" y1="240" x2="310" y2="220"/><line x1="330" y1="240" x2="330" y2="220"/>
      <line x1="270" y1="360" x2="270" y2="380"/><line x1="290" y1="360" x2="290" y2="380"/>
      <line x1="310" y1="360" x2="310" y2="380"/><line x1="330" y1="360" x2="330" y2="380"/>
    </g>

    <!-- RAM module top -->
    <rect x="120" y="100" width="180" height="50" rx="3" fill="rgba(0,255,136,0.04)" stroke="#00ff88" stroke-width="1.5"/>
    <text x="210" y="130" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#00ff88">RAM 16GB</text>
    <g stroke="#00ff88" stroke-width="1">
      <line x1="135" y1="150" x2="135" y2="160"/><line x1="155" y1="150" x2="155" y2="160"/>
      <line x1="175" y1="150" x2="175" y2="160"/><line x1="195" y1="150" x2="195" y2="160"/>
      <line x1="215" y1="150" x2="215" y2="160"/><line x1="235" y1="150" x2="235" y2="160"/>
      <line x1="255" y1="150" x2="255" y2="160"/><line x1="275" y1="150" x2="275" y2="160"/>
    </g>
    <path d="M 210 160 L 210 220 L 270 220" stroke="#00ff88" stroke-width="1.5"/>

    <!-- GPU bottom -->
    <rect x="420" y="450" width="160" height="60" rx="4" fill="rgba(0,255,136,0.04)" stroke="#00ff88" stroke-width="1.5"/>
    <text x="500" y="485" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#00ff88">GPU</text>
    <path d="M 360 360 L 360 420 L 500 420 L 500 450" stroke="#00ff88" stroke-width="1.5"/>

    <!-- Storage left -->
    <rect x="40" y="380" width="130" height="80" rx="4" fill="rgba(0,255,136,0.04)" stroke="#00ff88" stroke-width="1.5"/>
    <text x="105" y="410" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#00ff88">SSD</text>
    <text x="105" y="430" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#00ff88" opacity="0.7">1TB NVMe</text>
    <path d="M 170 420 L 220 420 L 220 300" stroke="#00ff88" stroke-width="1.5"/>

    <!-- Network port right -->
    <rect x="440" y="100" width="140" height="60" rx="4" fill="rgba(0,255,136,0.04)" stroke="#00ff88" stroke-width="1.5"/>
    <text x="510" y="135" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#00ff88">NET</text>
    <!-- Network animated dots -->
    <circle cx="465" cy="148" r="3" fill="#00ff88"/>
    <circle cx="485" cy="148" r="3" fill="#00ff88" opacity="0.6"/>
    <circle cx="505" cy="148" r="3" fill="#00ff88" opacity="0.3"/>
    <path d="M 510 160 L 510 220 L 330 220" stroke="#00ff88" stroke-width="1.5"/>

    <!-- Resistors (small rectangles on traces) -->
    <g fill="#00ff88" opacity="0.5">
      <rect x="195" y="216" width="14" height="8"/>
      <rect x="250" y="214" width="14" height="12"/>
    </g>

    <!-- Capacitors (circles) -->
    <g stroke="#00ff88" stroke-width="1.2" fill="rgba(0,255,136,0.1)">
      <circle cx="60" cy="240" r="14"/>
      <text x="60" y="245" text-anchor="middle" font-family="'SF Mono',monospace" font-size="8" fill="#00ff88">C1</text>
      <circle cx="60" cy="300" r="10"/>
    </g>

    <!-- LED indicators bottom-right -->
    <g>
      <circle cx="600" cy="360" r="6" fill="#22c55e"/>
      <circle cx="600" cy="380" r="6" fill="#f59e0b"/>
      <circle cx="600" cy="400" r="6" fill="#ef4444" opacity="0.4"/>
      <text x="615" y="365" font-family="'SF Mono',monospace" font-size="10" fill="#94a3b8">PWR</text>
      <text x="615" y="385" font-family="'SF Mono',monospace" font-size="10" fill="#94a3b8">DATA</text>
      <text x="615" y="405" font-family="'SF Mono',monospace" font-size="10" fill="#94a3b8">ERR</text>
    </g>

    <!-- Trace lines (extra circuitry feel) -->
    <g stroke="#00ff88" stroke-width="1" opacity="0.4">
      <path d="M 580 200 L 660 200 L 660 360 L 600 360"/>
      <path d="M 30 100 L 30 300"/>
    </g>
  </g>

  <!-- ───── LEFT-TOP: Service tags ───── -->
  <g transform="translate(110 90)">
    <text x="0" y="0" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00ff88" letter-spacing="5">/ / SOLUCIONES INFORMÁTICAS · 2024</text>
  </g>

  <!-- ───── LEFT-BOTTOM: services row ───── -->
  <g transform="translate(110 860)">
    <g>
      <rect x="0" y="0" width="100" height="34" rx="4" fill="rgba(0,255,136,0.08)" stroke="#00ff88" stroke-width="1"/>
      <text x="50" y="22" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#86efac" letter-spacing="2">REDES</text>
    </g>
    <g transform="translate(112 0)">
      <rect x="0" y="0" width="110" height="34" rx="4" fill="rgba(0,255,136,0.08)" stroke="#00ff88" stroke-width="1"/>
      <text x="55" y="22" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#86efac" letter-spacing="2">SERVERS</text>
    </g>
    <g transform="translate(234 0)">
      <rect x="0" y="0" width="120" height="34" rx="4" fill="rgba(0,255,136,0.08)" stroke="#00ff88" stroke-width="1"/>
      <text x="60" y="22" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#86efac" letter-spacing="2">ELÉCTRICA</text>
    </g>
    <g transform="translate(366 0)">
      <rect x="0" y="0" width="100" height="34" rx="4" fill="rgba(0,255,136,0.08)" stroke="#00ff88" stroke-width="1"/>
      <text x="50" y="22" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#86efac" letter-spacing="2">SOPORTE</text>
    </g>
  </g>

  <!-- ───── RIGHT PANEL ───── -->
  <text x="1480" y="290" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="18" letter-spacing="5" fill="#00ff88" opacity="0.9">LANDING · 2024</text>

  <text x="1480" y="510" text-anchor="end" font-family="'Inter','Helvetica Neue',sans-serif" font-weight="900" font-size="200" letter-spacing="-6" fill="#ffffff">ITALNET</text>

  <circle cx="1480" cy="474" r="14" fill="#00ff88"/>

  <line x1="830" y1="555" x2="1480" y2="555" stroke="#00ff88" stroke-width="1.5" opacity="0.55"/>
  <text x="1480" y="595" text-anchor="end" font-family="'Inter','Helvetica Neue',sans-serif" font-weight="600" font-size="22" letter-spacing="8" fill="#86efac">IT + ELECTRONIC SOLUTIONS</text>

  <text x="830" y="685" font-family="'Inter','Helvetica Neue',sans-serif" font-size="22" fill="#ffffff" opacity="0.75">Sitio informativo claro y ligero.</text>
  <text x="830" y="717" font-family="'Inter','Helvetica Neue',sans-serif" font-size="22" fill="#ffffff" opacity="0.55">Comunica servicios y presencia de marca.</text>
  <text x="830" y="749" font-family="'Inter','Helvetica Neue',sans-serif" font-size="22" fill="#ffffff" opacity="0.55">Diseño responsive y profesional.</text>

  <line x1="830" y1="820" x2="1480" y2="820" stroke="rgba(0,255,136,0.25)" stroke-width="1"/>
  <text x="1480" y="858" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="16" letter-spacing="6" fill="#86efac" opacity="0.7">HTML · CSS · RESPONSIVE DESIGN</text>

  <!-- Corner brackets -->
  <g stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 40 40 L 80 40 M 40 40 L 40 80"/>
    <path d="M 1560 40 L 1520 40 M 1560 40 L 1560 80"/>
    <path d="M 40 960 L 80 960 M 40 960 L 40 920"/>
    <path d="M 1560 960 L 1520 960 M 1560 960 L 1560 920"/>
  </g>
</svg>
