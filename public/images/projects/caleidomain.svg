<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#07090D"/>
      <stop offset="55%"  stop-color="#0E1119"/>
      <stop offset="100%" stop-color="#161B26"/>
    </linearGradient>
    <radialGradient id="cl-vignette" cx="50%" cy="43%" r="75%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="cl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#C9F285" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#B0E660" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#B0E660" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cl-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#C6F08A"/>
      <stop offset="55%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D2CBFF"/>
    </linearGradient>
    <path id="cl-petalA" d="M800 100 C748 250 748 360 800 430 C852 360 852 250 800 100 Z"/>
    <path id="cl-petalB" d="M800 192 C762 300 762 372 800 430 C838 372 838 300 800 192 Z"/>
  </defs>

  <!-- Background + vignette -->
  <rect width="1600" height="1000" fill="url(#cl-bg)"/>
  <rect width="1600" height="1000" fill="url(#cl-vignette)"/>

  <!-- Corner brackets -->
  <g stroke="#B0E660" stroke-width="2" fill="none" opacity="0.45">
    <path d="M40 40 L84 40 M40 40 L40 84"/>
    <path d="M1560 40 L1516 40 M1560 40 L1560 84"/>
    <path d="M40 960 L84 960 M40 960 L40 916"/>
    <path d="M1560 960 L1516 960 M1560 960 L1560 916"/>
  </g>

  <!-- Top-left label -->
  <text x="120" y="98" font-family="'Courier New', monospace" font-size="18" fill="#7C849A" letter-spacing="7">// GENERATIVE GEOMETRY STUDIO</text>

  <!-- Soft halo behind the mandala -->
  <circle cx="800" cy="430" r="340" fill="url(#cl-glow)"/>

  <!-- Petals · layer A (lime) -->
  <g fill="#B0E660" fill-opacity="0.06" stroke="#B0E660" stroke-opacity="0.55" stroke-width="2">
    <use href="#cl-petalA"/>
    <use href="#cl-petalA" transform="rotate(30 800 430)"/>
    <use href="#cl-petalA" transform="rotate(60 800 430)"/>
    <use href="#cl-petalA" transform="rotate(90 800 430)"/>
    <use href="#cl-petalA" transform="rotate(120 800 430)"/>
    <use href="#cl-petalA" transform="rotate(150 800 430)"/>
    <use href="#cl-petalA" transform="rotate(180 800 430)"/>
    <use href="#cl-petalA" transform="rotate(210 800 430)"/>
    <use href="#cl-petalA" transform="rotate(240 800 430)"/>
    <use href="#cl-petalA" transform="rotate(270 800 430)"/>
    <use href="#cl-petalA" transform="rotate(300 800 430)"/>
    <use href="#cl-petalA" transform="rotate(330 800 430)"/>
  </g>

  <!-- Petals · layer B (violet, offset 15deg) -->
  <g fill="#9A8CF5" fill-opacity="0.05" stroke="#9A8CF5" stroke-opacity="0.5" stroke-width="2">
    <use href="#cl-petalB" transform="rotate(15 800 430)"/>
    <use href="#cl-petalB" transform="rotate(45 800 430)"/>
    <use href="#cl-petalB" transform="rotate(75 800 430)"/>
    <use href="#cl-petalB" transform="rotate(105 800 430)"/>
    <use href="#cl-petalB" transform="rotate(135 800 430)"/>
    <use href="#cl-petalB" transform="rotate(165 800 430)"/>
    <use href="#cl-petalB" transform="rotate(195 800 430)"/>
    <use href="#cl-petalB" transform="rotate(225 800 430)"/>
    <use href="#cl-petalB" transform="rotate(255 800 430)"/>
    <use href="#cl-petalB" transform="rotate(285 800 430)"/>
    <use href="#cl-petalB" transform="rotate(315 800 430)"/>
    <use href="#cl-petalB" transform="rotate(345 800 430)"/>
  </g>

  <!-- Concentric rings -->
  <g fill="none" stroke="#B0E660">
    <circle cx="800" cy="430" r="88"  stroke-opacity="0.7"  stroke-width="2"/>
    <circle cx="800" cy="430" r="150" stroke-opacity="0.30" stroke-width="1.5"/>
    <circle cx="800" cy="430" r="212" stroke-opacity="0.5"  stroke-width="2"/>
    <circle cx="800" cy="430" r="274" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="800" cy="430" r="330" stroke-opacity="0.6"  stroke-width="2"/>
  </g>

  <!-- Outer tick ring (parametric feel) -->
  <circle cx="800" cy="430" r="348" fill="none" stroke="#F6F7F9" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 16" stroke-linecap="round"/>

  <!-- Flower-of-life rosette -->
  <g fill="none" stroke="#F6F7F9" stroke-opacity="0.4" stroke-width="1.5">
    <circle cx="800" cy="430" r="46"/>
    <circle cx="846" cy="430" r="46"/>
    <circle cx="823" cy="470" r="46"/>
    <circle cx="777" cy="470" r="46"/>
    <circle cx="754" cy="430" r="46"/>
    <circle cx="777" cy="390" r="46"/>
    <circle cx="823" cy="390" r="46"/>
  </g>

  <!-- Center -->
  <circle cx="800" cy="430" r="14" fill="#B0E660"/>
  <circle cx="800" cy="430" r="24" fill="none" stroke="#F6F7F9" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Wordmark -->
  <text x="118" y="862" font-family="'Arial Black', Impact, sans-serif" font-size="116" font-weight="900" letter-spacing="3" fill="url(#cl-word)">CALEIDO</text>
  <line x1="124" y1="892" x2="640" y2="892" stroke="#B0E660" stroke-width="2" opacity="0.7"/>
  <text x="126" y="926" font-family="'Courier New', monospace" font-size="19" fill="#9AA0B2" letter-spacing="5">MANDALAS · SPIROGRAPHS · FLOW FIELDS · PURE SVG</text>
</svg>
