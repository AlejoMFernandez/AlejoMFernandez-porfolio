<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Refugio del Pintor — refugio de pueblo en Tilcara, Quebrada de Humahuaca">
  <defs>
    <linearGradient id="rp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8FB4CC"/>
      <stop offset="70%" stop-color="#BCD2DA"/>
      <stop offset="100%" stop-color="#D9E2E0"/>
    </linearGradient>
    <pattern id="rp-stone" width="70" height="46" patternUnits="userSpaceOnUse">
      <rect width="70" height="46" fill="#a3937d"/>
      <rect x="3"  y="3"  width="30" height="17" rx="5" fill="#bcae97"/>
      <rect x="37" y="4"  width="28" height="16" rx="5" fill="#978973"/>
      <rect x="14" y="25" width="30" height="17" rx="5" fill="#ab9d85"/>
      <rect x="48" y="26" width="18" height="16" rx="5" fill="#b3a68f"/>
      <rect x="-8" y="26" width="18" height="16" rx="5" fill="#8b7e69"/>
    </pattern>
  </defs>

  <!-- Base cream -->
  <rect width="1600" height="1000" fill="#F2EDE3"/>

  <!-- ───── LEFT SCENE (0–940) ───── -->
  <svg x="0" y="0" width="940" height="1000" viewBox="0 0 940 1000">
    <!-- Sky -->
    <rect width="940" height="1000" fill="url(#rp-sky)"/>

    <!-- Quebrada mountains, back -->
    <polygon points="0,560 180,420 360,505 560,375 760,470 940,405 940,640 0,640" fill="#C79A5A"/>
    <!-- Quebrada mountains, front -->
    <polygon points="0,610 240,505 480,575 720,495 940,555 940,700 0,700" fill="#A25E3A"/>
    <!-- Foreground ground -->
    <rect x="0" y="678" width="940" height="322" fill="#8a5236"/>

    <!-- Cardón cactus -->
    <g fill="#586B41">
      <rect x="792" y="560" width="52" height="440" rx="26"/>
      <rect x="742" y="655" width="34" height="150" rx="17"/>
      <rect x="742" y="655" width="90" height="34" rx="17"/>
      <rect x="860" y="620" width="34" height="150" rx="17"/>
      <rect x="812" y="620" width="82" height="34" rx="17"/>
    </g>
    <g stroke="#45532f" stroke-width="3" opacity="0.5">
      <line x1="818" y1="580" x2="818" y2="990"/>
    </g>

    <!-- Adobe / stone house -->
    <!-- roof cap + wood beams -->
    <rect x="70" y="452" width="596" height="20" fill="#7c5230"/>
    <g fill="#5f3f22">
      <rect x="96"  y="432" width="12" height="24"/>
      <rect x="150" y="432" width="12" height="24"/>
      <rect x="204" y="432" width="12" height="24"/>
      <rect x="258" y="432" width="12" height="24"/>
      <rect x="312" y="432" width="12" height="24"/>
      <rect x="366" y="432" width="12" height="24"/>
      <rect x="420" y="432" width="12" height="24"/>
      <rect x="474" y="432" width="12" height="24"/>
      <rect x="528" y="432" width="12" height="24"/>
      <rect x="582" y="432" width="12" height="24"/>
      <rect x="628" y="432" width="12" height="24"/>
    </g>
    <!-- chimney -->
    <rect x="150" y="352" width="78" height="104" rx="4" fill="#b98d5e"/>
    <rect x="150" y="352" width="78" height="16" rx="4" fill="#8a6238"/>
    <rect x="176" y="360" width="26" height="12" fill="#3a2a1c"/>

    <!-- wall (stone) -->
    <rect x="88" y="470" width="560" height="530" fill="url(#rp-stone)"/>
    <!-- plaster corner shading -->
    <rect x="88" y="470" width="560" height="530" fill="#7a5a3c" opacity="0.10"/>

    <!-- upper window with wood frame -->
    <g>
      <rect x="176" y="536" width="176" height="150" fill="#6a4527"/>
      <rect x="190" y="550" width="148" height="122" fill="#40525c"/>
      <rect x="258" y="550" width="12" height="122" fill="#6a4527"/>
      <rect x="190" y="605" width="148" height="12" fill="#6a4527"/>
      <!-- soft curtain -->
      <rect x="190" y="550" width="60" height="122" fill="#e9e3d6" opacity="0.55"/>
    </g>

    <!-- arched doorway -->
    <path d="M424 1000 L424 720 A66 66 0 0 1 556 720 L556 1000 Z" fill="#6a4527"/>
    <path d="M442 1000 L442 726 A48 48 0 0 1 538 726 L538 1000 Z" fill="#2c2018"/>

    <!-- foreground plant frond (corner) -->
    <g fill="#3f5230" opacity="0.9">
      <path d="M0 1000 C 40 900 30 820 70 770 C 60 850 80 920 60 1000 Z"/>
      <path d="M0 1000 C 10 930 -20 880 -10 820 C -40 890 -30 950 -30 1000 Z"/>
    </g>
  </svg>

  <!-- ───── RIGHT PANEL (940–1600) ───── -->
  <rect x="940" y="0" width="660" height="1000" fill="#F2EDE3"/>

  <!-- corner brackets -->
  <g stroke="#A5432C" stroke-width="1.6" fill="none" opacity="0.6">
    <path d="M 40 40 L 80 40 M 40 40 L 40 80"/>
    <path d="M 1560 40 L 1520 40 M 1560 40 L 1560 80"/>
    <path d="M 1560 960 L 1520 960 M 1560 960 L 1560 920"/>
  </g>

  <text x="1000" y="332" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="27" fill="#9C6A44" letter-spacing="1">Tilcara · Quebrada de Humahuaca</text>

  <text x="1000" y="458" font-family="Georgia,'Times New Roman',serif" font-size="94" fill="#2A2018">
    <tspan font-style="italic" font-weight="400">del </tspan><tspan font-weight="600">Pintor</tspan>
  </text>
  <text x="1004" y="506" font-family="Georgia,'Times New Roman',serif" font-size="21" letter-spacing="7" fill="#7A6A54">REFUGIO DE PUEBLO</text>

  <line x1="1002" y1="556" x2="1230" y2="556" stroke="#A5432C" stroke-width="2"/>

  <text x="1000" y="672" font-family="Georgia,'Times New Roman',serif" font-size="48" fill="#2A2018">No es un hotel.</text>
  <text x="1000" y="738" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="48" fill="#A5432C">Es un refugio.</text>
</svg>
