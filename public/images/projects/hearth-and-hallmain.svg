<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- A warm candle halo, offset to the left where the candle sits -->
    <radialGradient id="halo-main" cx="0.32" cy="0.55" r="0.5">
      <stop offset="0%"   stop-color="#F5C76A" stop-opacity="0.55"/>
      <stop offset="40%"  stop-color="#E8A04F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3D2914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="wood-grain" x1="0" y1="0" x2="1" y2="0.1">
      <stop offset="0%"   stop-color="#2A2520"/>
      <stop offset="50%"  stop-color="#3D2914"/>
      <stop offset="100%" stop-color="#2A2520"/>
    </linearGradient>
    <filter id="grain-main" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.96
                             0 0 0 0 0.88
                             0 0 0 0 0.72
                             0 0 0 0.06 0"/>
    </filter>

    <!-- Re-usable candle glyph -->
    <symbol id="candle" viewBox="0 0 80 200">
      <!-- flame -->
      <path d="M40 0 C28 22 24 38 30 52 C34 58 40 62 40 70 C40 62 46 58 50 52 C56 38 52 22 40 0 Z"
            fill="#F5C76A"/>
      <!-- wick -->
      <rect x="39" y="60" width="2" height="14" fill="#3D2914"/>
      <!-- candle body -->
      <rect x="28" y="74" width="24" height="100" fill="#F4EAD5" opacity="0.85"/>
      <!-- holder base -->
      <rect x="22" y="174" width="36" height="14" rx="2" fill="#2A2520"/>
    </symbol>
  </defs>

  <!-- Deep wood plate -->
  <rect width="1600" height="1000" fill="url(#wood-grain)"/>
  <!-- candle-warm wash, offset to the left -->
  <rect width="1600" height="1000" fill="url(#halo-main)"/>
  <rect width="1600" height="1000" fill="url(#vignette-main)"/>
  <rect width="1600" height="1000" filter="url(#grain-main)" opacity="0.55"/>

  <!-- Candle glyph anchored on the left third, halo-aligned -->
  <use href="#candle" x="380" y="350" width="160" height="400"/>
  <!-- Soft amber bloom around the flame -->
  <circle cx="460" cy="380" r="180" fill="url(#halo-main)" opacity="0.65"/>

  <text
    x="1500" y="595"
    text-anchor="end"
    font-family="'Cormorant Garamond', 'Times New Roman', serif"
    font-size="172"
    font-weight="500"
    letter-spacing="-3"
    fill="#F4EAD5"
  >Hearth <tspan font-style="italic" fill="#F5C76A">&amp;</tspan> Hall</text>

  <text
    x="1500" y="670"
    text-anchor="end"
    font-family="'Cormorant Garamond', 'Times New Roman', serif"
    font-style="italic"
    font-size="38"
    fill="#ECDFBF"
  >Furniture for the slow hours of the house.</text>

</svg>
