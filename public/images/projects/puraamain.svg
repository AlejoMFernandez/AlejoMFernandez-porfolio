<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Puraa natural cosmetics e-commerce preview">
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1a3328"/>
      <stop offset="60%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#3d8862"/>
    </linearGradient>
    <radialGradient id="p-glow" cx="0.35" cy="0.5" r="0.6">
      <stop offset="0%"  stop-color="#d4e09b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4e09b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p-vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="p-bottle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f4e8d0"/>
      <stop offset="100%" stop-color="#e0d4b8"/>
    </linearGradient>
    <linearGradient id="p-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8db580" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4d7a3f" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#p-bg)"/>
  <rect width="1600" height="1000" fill="url(#p-glow)"/>
  <rect width="1600" height="1000" fill="url(#p-vignette)"/>

  <!-- ───── LEFT: Botanical composition ───── -->
  <g transform="translate(110 130)">

    <!-- Background organic circle (moon-like) -->
    <circle cx="350" cy="380" r="240" fill="rgba(244,232,208,0.06)" stroke="rgba(244,232,208,0.18)" stroke-width="1.5"/>
    <circle cx="350" cy="380" r="260" fill="none" stroke="rgba(244,232,208,0.08)" stroke-width="1" stroke-dasharray="2 8"/>

    <!-- BOTTLE in center -->
    <g transform="translate(218 80) scale(2.2)">
      <!-- Cap -->
      <rect x="42" y="0" width="36" height="28" rx="3" fill="#2d2018" stroke="#1a1208" stroke-width="1.2"/>
      <rect x="48" y="-8" width="24" height="10" rx="2" fill="#3a2a18" stroke="#1a1208" stroke-width="1"/>
      <!-- Neck -->
      <rect x="50" y="28" width="20" height="14" fill="url(#p-bottle)" stroke="#8a7a5c" stroke-width="1.2"/>
      <!-- Body -->
      <path d="M 30 42 L 90 42 L 96 60 L 96 240 Q 96 260 60 260 Q 24 260 24 240 L 24 60 Z" fill="url(#p-bottle)" stroke="#8a7a5c" stroke-width="1.5"/>
      <!-- Liquid inside (lower half) -->
      <path d="M 26 140 L 94 140 L 94 240 Q 94 258 60 258 Q 26 258 26 240 Z" fill="url(#p-liquid)"/>
      <!-- Label -->
      <rect x="32" y="100" width="56" height="100" rx="2" fill="rgba(255,255,255,0.85)" stroke="#8a7a5c" stroke-width="0.8"/>
      <!-- Brand on label -->
      <text x="60" y="130" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="700" font-size="12" fill="#2d6a4f" letter-spacing="2">PURAA</text>
      <line x1="40" y1="138" x2="80" y2="138" stroke="#8db580" stroke-width="0.6"/>
      <text x="60" y="158" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7" fill="#4d7a3f" opacity="0.85">SERUM</text>
      <text x="60" y="172" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7" fill="#4d7a3f" opacity="0.85">FACIAL</text>
      <text x="60" y="190" text-anchor="middle" font-family="'Inter',sans-serif" font-size="6" fill="#4d7a3f" opacity="0.6">30 ml · ORGANIC</text>
      <!-- Highlight on bottle -->
      <path d="M 32 50 L 32 220" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- LEAVES around bottle -->
    <!-- Left big leaf -->
    <g transform="translate(60 380)" fill="rgba(141,181,128,0.7)" stroke="#5d8c4a" stroke-width="1.5">
      <path d="M 0 0 Q -80 -30 -130 -110 Q -100 -130 -50 -115 Q 0 -80 25 -12 Z"/>
      <path d="M -12 -12 Q -65 -40 -105 -90" stroke="#3d6a2a" stroke-width="1" fill="none"/>
      <path d="M -38 -25 L -65 -65" stroke="#3d6a2a" stroke-width="0.8" fill="none"/>
      <path d="M -55 -12 L -85 -52" stroke="#3d6a2a" stroke-width="0.8" fill="none"/>
    </g>

    <!-- Right leaf -->
    <g transform="translate(660 360)" fill="rgba(141,181,128,0.7)" stroke="#5d8c4a" stroke-width="1.5">
      <path d="M 0 0 Q 80 -30 130 -110 Q 100 -130 50 -115 Q 0 -80 -25 -12 Z"/>
      <path d="M 12 -12 Q 65 -40 105 -90" stroke="#3d6a2a" stroke-width="1" fill="none"/>
      <path d="M 38 -25 L 65 -65" stroke="#3d6a2a" stroke-width="0.8" fill="none"/>
    </g>

    <!-- Bottom leaves (cascade) -->
    <g transform="translate(130 680)" fill="rgba(141,181,128,0.55)" stroke="#5d8c4a" stroke-width="1.2">
      <path d="M 0 0 Q 40 -55 110 -40 Q 120 0 80 40 Q 28 40 0 0 Z"/>
    </g>
    <g transform="translate(590 690)" fill="rgba(141,181,128,0.55)" stroke="#5d8c4a" stroke-width="1.2">
      <path d="M 0 0 Q -40 -55 -110 -40 Q -120 0 -80 40 Q -28 40 0 0 Z"/>
    </g>

    <!-- Small floating leaves / petals -->
    <g fill="rgba(212,224,155,0.6)" stroke="#a8c47a" stroke-width="0.8">
      <ellipse cx="90" cy="200" rx="18" ry="8" transform="rotate(30 90 200)"/>
      <ellipse cx="640" cy="220" rx="18" ry="8" transform="rotate(-25 640 220)"/>
      <ellipse cx="110" cy="760" rx="15" ry="6" transform="rotate(20 110 760)"/>
      <ellipse cx="620" cy="770" rx="15" ry="6" transform="rotate(-15 620 770)"/>
      <circle cx="55" cy="520" r="5" fill="#d4e09b"/>
      <circle cx="690" cy="500" r="5" fill="#d4e09b"/>
      <circle cx="360" cy="85" r="5" fill="#d4e09b"/>
    </g>

    <!-- Roots/branches subtle bottom -->
    <g stroke="rgba(141,181,128,0.4)" stroke-width="1" fill="none">
      <path d="M 350 660 Q 320 690 290 720"/>
      <path d="M 350 660 Q 380 690 410 720"/>
      <path d="M 350 660 Q 350 700 350 730"/>
    </g>
  </g>


  <!-- ───── RIGHT PANEL ───── -->

  <text x="1480" y="510" text-anchor="end" font-family="'Inter','Helvetica Neue',sans-serif" font-weight="900" font-size="220" letter-spacing="-7" fill="#f4e8d0">PURAA</text>

  <circle cx="1480" cy="474" r="16" fill="#d4e09b"/>

  <line x1="830" y1="555" x2="1480" y2="555" stroke="#d4e09b" stroke-width="1.5" opacity="0.55"/>
  <text x="1480" y="595" text-anchor="end" font-family="'Inter',sans-serif" font-style="italic" font-weight="500" font-size="24" letter-spacing="6" fill="#d4e09b">bioconciencia · alquimia vegetal</text>



  <!-- Corner brackets -->
  <g stroke="#d4e09b" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 40 40 L 80 40 M 40 40 L 40 80"/>
    <path d="M 1560 40 L 1520 40 M 1560 40 L 1560 80"/>
    <path d="M 40 960 L 80 960 M 40 960 L 40 920"/>
    <path d="M 1560 960 L 1520 960 M 1560 960 L 1560 920"/>
  </g>
</svg>
