<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="ArianaDeViaje travel website preview">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#012526"/>
      <stop offset="100%" stop-color="#024548"/>
    </linearGradient>
    <radialGradient id="a-glow" cx="0.35" cy="0.55" r="0.55">
      <stop offset="0%"  stop-color="#02b6b0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#02b6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a-vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#a-bg)"/>
  <rect width="1600" height="1000" fill="url(#a-glow)"/>
  <rect width="1600" height="1000" fill="url(#a-vignette)"/>

  <!-- Latitude / longitude grid -->
  <g opacity="0.07" stroke="#02b6b0" stroke-width="0.5">
    <path d="M 100 200 Q 380 180 660 200" fill="none"/>
    <path d="M 100 300 Q 380 280 660 300" fill="none"/>
    <path d="M 100 400 Q 380 380 660 400" fill="none"/>
    <path d="M 100 500 Q 380 480 660 500" fill="none"/>
    <path d="M 100 600 Q 380 580 660 600" fill="none"/>
    <path d="M 100 700 Q 380 680 660 700" fill="none"/>
    <path d="M 100 800 Q 380 780 660 800" fill="none"/>
    <path d="M 150 100 Q 130 480 150 880" fill="none"/>
    <path d="M 260 100 Q 240 480 260 880" fill="none"/>
    <path d="M 370 100 Q 350 480 370 880" fill="none"/>
    <path d="M 480 100 Q 460 480 480 880" fill="none"/>
    <path d="M 590 100 Q 570 480 590 880" fill="none"/>
  </g>

  <!-- ───── LEFT: World map silhouette (stylized continents) ───── -->
  <g transform="translate(90 200)" fill="rgba(2,182,176,0.18)" stroke="#02b6b0" stroke-width="1.2">
    <!-- South America (the star, since the brand is travel from Argentina) -->
    <path d="M 320 350 Q 340 320 360 330 Q 380 350 385 400 Q 390 460 380 510 Q 370 560 350 590 Q 330 605 320 590 Q 305 570 300 530 Q 295 480 305 430 Q 310 390 320 350 Z" fill="rgba(2,182,176,0.3)" stroke="#02b6b0" stroke-width="1.8"/>
    <!-- North America stub -->
    <path d="M 180 200 Q 220 180 270 195 Q 310 215 305 260 Q 295 290 270 295 Q 230 295 200 280 Q 175 250 180 200 Z" fill="rgba(2,182,176,0.15)"/>
    <!-- Europe -->
    <path d="M 380 200 Q 410 190 430 205 Q 440 225 425 240 Q 405 245 390 235 Q 375 220 380 200 Z" fill="rgba(2,182,176,0.15)"/>
    <!-- Africa -->
    <path d="M 430 280 Q 460 270 480 300 Q 490 340 480 390 Q 465 430 445 425 Q 420 415 415 380 Q 415 340 425 310 Q 430 290 430 280 Z" fill="rgba(2,182,176,0.15)"/>
    <!-- Asia stub -->
    <path d="M 470 200 Q 540 190 600 220 Q 620 250 595 270 Q 540 280 490 270 Q 460 250 470 200 Z" fill="rgba(2,182,176,0.15)"/>
    <!-- Australia -->
    <path d="M 600 460 Q 640 450 660 475 Q 650 500 620 505 Q 595 495 600 460 Z" fill="rgba(2,182,176,0.15)"/>
  </g>

  <!-- ───── Destination pins ───── -->
  <g>
    <!-- Pin 1: Buenos Aires (origin) -->
    <g transform="translate(440 690)">
      <path d="M 0 0 Q -12 -16 0 -32 Q 12 -16 0 0 Z" fill="#02b6b0" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="0" cy="-20" r="5" fill="#012526"/>
      <text x="14" y="-12" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#02b6b0">BUENOS AIRES</text>
    </g>
    <!-- Pin 2: Bariloche -->
    <g transform="translate(420 760)">
      <path d="M 0 0 Q -10 -13 0 -26 Q 10 -13 0 0 Z" fill="#fbbf24" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="0" cy="-16" r="3.5" fill="#012526"/>
      <text x="12" y="-10" font-family="'SF Mono',monospace" font-size="9" fill="#fbbf24" opacity="0.9">BARILOCHE</text>
    </g>
    <!-- Pin 3: Madrid -->
    <g transform="translate(495 358)">
      <path d="M 0 0 Q -10 -13 0 -26 Q 10 -13 0 0 Z" fill="#fbbf24" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="0" cy="-16" r="3.5" fill="#012526"/>
      <text x="12" y="-10" font-family="'SF Mono',monospace" font-size="9" fill="#fbbf24" opacity="0.9">MADRID</text>
    </g>
    <!-- Pin 4: Bali -->
    <g transform="translate(680 440)">
      <path d="M 0 0 Q -10 -13 0 -26 Q 10 -13 0 0 Z" fill="#fbbf24" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="0" cy="-16" r="3.5" fill="#012526"/>
      <text x="12" y="-10" font-family="'SF Mono',monospace" font-size="9" fill="#fbbf24" opacity="0.9">BALI</text>
    </g>
  </g>

  <!-- Flight path (dotted curve from BA to Madrid) -->
  <path d="M 440 690 Q 200 400 495 358" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="4 6" opacity="0.85"/>
  <!-- Plane along path -->
  <g transform="translate(260 420) rotate(-25)">
    <path d="M 0 0 L 22 -4 L 30 0 L 22 4 L 0 0 Z M 8 -3 L -6 -10 L -6 -2 L 8 -1 Z M 8 3 L -6 10 L -6 2 L 8 1 Z" fill="#ffffff" stroke="#fbbf24" stroke-width="1.2"/>
  </g>

  <!-- ───── LEFT-TOP: trip ticker ───── -->
  <g transform="translate(110 90)">
    <text x="0" y="0" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#02b6b0" letter-spacing="5">/ / DESTINOS · ARGENTINA + EL MUNDO</text>
  </g>

  <!-- ───── LEFT-BOTTOM: passport stamp ───── -->
  <g transform="translate(110 870)">
    <g stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.85">
      <rect x="0" y="0" width="120" height="60" rx="4" transform="rotate(-4 60 30)"/>
      <text x="60" y="26" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" font-weight="700" fill="#fbbf24" transform="rotate(-4 60 30)">PASSPORT</text>
      <text x="60" y="44" text-anchor="middle" font-family="'SF Mono',monospace" font-size="9" fill="#fbbf24" opacity="0.8" transform="rotate(-4 60 30)">VISA OK · 2026</text>
    </g>
    <text x="140" y="28" font-family="'SF Mono',monospace" font-size="11" fill="#a7f3d0" letter-spacing="3">12 PAÍSES · 47 DESTINOS</text>
    <text x="140" y="44" font-family="'SF Mono',monospace" font-size="10" fill="#94a3b8" opacity="0.8" letter-spacing="2">PRESENCIA DIGITAL CONSOLIDADA</text>
  </g>

  <!-- ───── RIGHT PANEL ───── -->

  <text x="1480" y="490" text-anchor="end" font-family="'Inter','Helvetica Neue',sans-serif" font-weight="900" font-size="116" letter-spacing="-3" fill="#ffffff">ARIANA</text>
  <text x="1480" y="600" text-anchor="end" font-family="'Inter','Helvetica Neue',sans-serif" font-weight="700" font-style="italic" font-size="92" letter-spacing="-1" fill="#02b6b0">de viaje</text>

  <circle cx="1480" cy="454" r="14" fill="#02b6b0"/>

  <line x1="830" y1="650" x2="1480" y2="650" stroke="#02b6b0" stroke-width="1.5" opacity="0.55"/>
  <text x="1480" y="688" text-anchor="end" font-family="'Inter','Helvetica Neue',sans-serif" font-weight="600" font-size="20" letter-spacing="7" fill="#a7f3d0">TRAVEL · IDENTIDAD VISUAL</text>

  <!-- Corner brackets -->
  <g stroke="#02b6b0" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 40 40 L 80 40 M 40 40 L 40 80"/>
    <path d="M 1560 40 L 1520 40 M 1560 40 L 1560 80"/>
    <path d="M 40 960 L 80 960 M 40 960 L 40 920"/>
    <path d="M 1560 960 L 1520 960 M 1560 960 L 1560 920"/>
  </g>
</svg>
