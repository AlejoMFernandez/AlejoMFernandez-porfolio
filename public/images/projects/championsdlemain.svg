<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Champions.dle UEFA Champions League guessing PWA preview">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#1a2636"/>
    </linearGradient>
    <radialGradient id="c-glow" cx="0.32" cy="0.5" r="0.55">
      <stop offset="0%"  stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c-trophy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="c-blur"><feGaussianBlur stdDeviation="0.3"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#c-bg)"/>
  <rect width="1600" height="1000" fill="url(#c-glow)"/>

  <!-- Stadium dots/stars (UCL atmosphere) -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="80" cy="120" r="1.5"/><circle cx="160" cy="80" r="1"/><circle cx="240" cy="160" r="1.5"/>
    <circle cx="380" cy="60" r="1"/><circle cx="520" cy="140" r="1.2"/><circle cx="640" cy="40" r="1.5"/>
    <circle cx="700" cy="220" r="1"/><circle cx="60" cy="280" r="1.2"/><circle cx="200" cy="340" r="1"/>
    <circle cx="900" cy="60" r="1.2"/><circle cx="1050" cy="120" r="1.5"/><circle cx="1180" cy="80" r="1"/>
    <circle cx="1320" cy="160" r="1.3"/><circle cx="1450" cy="60" r="1.5"/>
  </g>

  <!-- UCL Star pattern (subtle, central) -->
  <g transform="translate(380 540)" opacity="0.06" stroke="#ffffff" fill="none" stroke-width="1.2">
    <!-- 8 radial UCL stars -->
    <g><path d="M 0 -180 L 12 -50 L 130 -45 L 30 30 L 60 160 L 0 80 L -60 160 L -30 30 L -130 -45 L -12 -50 Z" transform="rotate(0)"/></g>
    <g><path d="M 0 -180 L 12 -50 L 130 -45 L 30 30 L 60 160 L 0 80 L -60 160 L -30 30 L -130 -45 L -12 -50 Z" transform="rotate(45)"/></g>
    <g><path d="M 0 -180 L 12 -50 L 130 -45 L 30 30 L 60 160 L 0 80 L -60 160 L -30 30 L -130 -45 L -12 -50 Z" transform="rotate(90)"/></g>
    <g><path d="M 0 -180 L 12 -50 L 130 -45 L 30 30 L 60 160 L 0 80 L -60 160 L -30 30 L -130 -45 L -12 -50 Z" transform="rotate(135)"/></g>
  </g>

  <!-- ───── LEFT: Player silhouette with ball ───── -->
  <g transform="translate(280 280)" filter="url(#c-blur)">
    <!-- Spotlight under player -->
    <ellipse cx="100" cy="580" rx="120" ry="22" fill="#3b82f6" opacity="0.18"/>

    <!-- Player silhouette -->
    <g fill="#0a1224" stroke="#3b82f6" stroke-width="2.5">
      <!-- Head -->
      <circle cx="100" cy="60" r="34"/>
      <!-- Torso -->
      <path d="M 64 90 L 136 90 L 150 240 L 50 240 Z"/>
      <!-- Left arm -->
      <path d="M 64 100 L 28 220 L 50 240 L 78 110 Z"/>
      <!-- Right arm (raised) -->
      <path d="M 136 100 L 200 60 L 215 80 L 150 130 Z"/>
      <!-- Hips -->
      <path d="M 50 240 L 150 240 L 145 280 L 55 280 Z"/>
      <!-- Left leg -->
      <path d="M 55 280 L 35 470 L 80 480 L 95 290 Z"/>
      <!-- Right leg (kicking forward) -->
      <path d="M 105 290 L 220 380 L 235 360 L 145 280 Z"/>
    </g>

    <!-- Question mark over face (it's a guess game!) -->
    <g transform="translate(80 36)">
      <text x="20" y="32" text-anchor="middle" font-family="'Inter',sans-serif" font-size="56" font-weight="900" fill="#3b82f6" opacity="0.85">?</text>
    </g>

    <!-- Ball with UEFA-ish pattern -->
    <g transform="translate(260 380)">
      <circle cx="0" cy="0" r="32" fill="#ffffff" stroke="#0a1224" stroke-width="1.5"/>
      <polygon points="0,-18 14,-6 9,12 -9,12 -14,-6" fill="#0a1224"/>
      <line x1="0" y1="-32" x2="0" y2="-18" stroke="#0a1224" stroke-width="1.5"/>
      <line x1="32" y1="0" x2="14" y2="-6" stroke="#0a1224" stroke-width="1.5"/>
      <line x1="20" y1="26" x2="9" y2="12" stroke="#0a1224" stroke-width="1.5"/>
      <line x1="-20" y1="26" x2="-9" y2="12" stroke="#0a1224" stroke-width="1.5"/>
      <line x1="-32" y1="0" x2="-14" y2="-6" stroke="#0a1224" stroke-width="1.5"/>
    </g>

    <!-- Trophy floating above -->
    <g transform="translate(60 -60)">
      <!-- Handles -->
      <path d="M 5 30 Q -18 30 -18 60 Q -18 80 5 80" fill="none" stroke="url(#c-trophy)" stroke-width="4"/>
      <path d="M 95 30 Q 118 30 118 60 Q 118 80 95 80" fill="none" stroke="url(#c-trophy)" stroke-width="4"/>
      <!-- Cup -->
      <path d="M 5 20 L 95 20 L 88 90 Q 50 100 12 90 Z" fill="url(#c-trophy)" stroke="#475569" stroke-width="1"/>
      <!-- Base -->
      <rect x="35" y="98" width="30" height="10" fill="url(#c-trophy)" stroke="#475569"/>
      <rect x="25" y="108" width="50" height="8" fill="url(#c-trophy)" stroke="#475569"/>
      <!-- Star on cup -->
      <text x="50" y="62" text-anchor="middle" font-size="28" fill="#3b82f6">★</text>
    </g>
  </g>

  <!-- ───── LEFT-TOP: Mode chips ───── -->
  <g transform="translate(120 80)">
    <text x="0" y="0" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#3b82f6" letter-spacing="5">DAILY MODE · STREAK 12 🔥</text>

    <!-- 3 game mode chips -->
    <g transform="translate(0 30)">
      <rect x="0" y="0" width="120" height="34" rx="17" fill="#3b82f6" opacity="0.18" stroke="#3b82f6" stroke-width="1"/>
      <text x="60" y="22" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#93c5fd" letter-spacing="2">GUESS PHOTO</text>

      <rect x="130" y="0" width="120" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="190" y="22" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="2">GUESS NAME</text>

      <rect x="260" y="0" width="120" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="320" y="22" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="2">GUESS CLUB</text>
    </g>
  </g>

  <!-- ───── RIGHT PANEL ───── -->
  <text x="1480" y="290" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="18" letter-spacing="5" fill="#3b82f6" opacity="0.9">PWA · 2025</text>

  <text x="1480" y="490" text-anchor="end" font-family="'Inter','Helvetica Neue',sans-serif" font-weight="900" font-size="148" letter-spacing="-4" fill="#ffffff">CHAMPIONS</text>
  <text x="1480" y="600" text-anchor="end" font-family="'Inter','Helvetica Neue',sans-serif" font-weight="900" font-size="148" letter-spacing="-4" fill="#3b82f6">.dle</text>

  <circle cx="1480" cy="454" r="14" fill="#3b82f6"/>

  <line x1="830" y1="650" x2="1480" y2="650" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
  <text x="1480" y="688" text-anchor="end" font-family="'Inter','Helvetica Neue',sans-serif" font-weight="600" font-size="20" letter-spacing="7" fill="#93c5fd">UEFA GUESSING GAME</text>

  <text x="830" y="760" font-family="'Inter','Helvetica Neue',sans-serif" font-size="20" fill="#ffffff" opacity="0.75">Top 9 equipos · 3 modos de juego.</text>
  <text x="830" y="790" font-family="'Inter','Helvetica Neue',sans-serif" font-size="20" fill="#ffffff" opacity="0.55">Rachas, favoritos y soporte offline.</text>

  <line x1="830" y1="850" x2="1480" y2="850" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
  <text x="1480" y="888" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="16" letter-spacing="6" fill="#93c5fd" opacity="0.7">PWA · JS · API REST · SERVICE WORKER</text>

  <!-- Corner brackets -->
  <g stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 40 40 L 80 40 M 40 40 L 40 80"/>
    <path d="M 1560 40 L 1520 40 M 1560 40 L 1560 80"/>
    <path d="M 40 960 L 80 960 M 40 960 L 40 920"/>
    <path d="M 1560 960 L 1520 960 M 1560 960 L 1560 920"/>
  </g>
</svg>
