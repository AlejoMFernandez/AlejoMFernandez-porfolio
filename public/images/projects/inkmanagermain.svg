<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="InkManager body map preview">
    <defs>
        <radialGradient id="vignette" cx="50%" cy="40%" r="70%">
            <stop offset="0%"  stop-color="#1a0606"/>
            <stop offset="60%" stop-color="#0a0a0a"/>
            <stop offset="100%" stop-color="#000000"/>
        </radialGradient>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#2a2050"/>
            <stop offset="100%" stop-color="#19172a"/>
        </linearGradient>
        <pattern id="grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
            <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(220,38,38,0.06)" stroke-width="1"/>
        </pattern>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1600" height="1000" fill="url(#vignette)"/>
    <rect width="1600" height="1000" fill="url(#grid)" opacity="0.5"/>

    <!-- Decorative corner brackets -->
    <g stroke="#ef4444" stroke-width="2" fill="none" opacity="0.55">
        <path d="M 40 40 L 80 40 M 40 40 L 40 80"/>
        <path d="M 1560 40 L 1520 40 M 1560 40 L 1560 80"/>
        <path d="M 40 960 L 80 960 M 40 960 L 40 920"/>
        <path d="M 1560 960 L 1520 960 M 1560 960 L 1560 920"/>
    </g>

    <!-- Branding text top-left -->
    <text x="80" y="100" font-family="'Courier New', monospace" font-size="14" fill="#6b7280" letter-spacing="6">
        / / 3D BODY MAP &#8212; STUDIO PREVIEW
    </text>

    <!-- Brand wordmark bottom-right -->
    <text x="1520" y="880" font-family="Impact, 'Arial Black', sans-serif" font-size="52" fill="#ffffff" text-anchor="end" letter-spacing="6">
        INKMANAGER
    </text>
    <line x1="1200" y1="895" x2="1520" y2="895" stroke="#ef4444" stroke-width="1" opacity="0.6"/>
    <text x="1520" y="920" font-family="'Courier New', monospace" font-size="12" fill="#9ca3af" text-anchor="end" letter-spacing="4">
        DIGITAL STUDIO SYSTEM
    </text>

    <!-- Floor disc -->
    <ellipse cx="800" cy="880" rx="280" ry="40" fill="#3a0000" opacity="0.4"/>
    <ellipse cx="800" cy="880" rx="180" ry="22" fill="#ef4444" opacity="0.15"/>

    <!-- ───── BODY SILHOUETTE (procedural humanoid) ───── -->
    <g transform="translate(800, 480)" stroke="rgba(255,255,255,0.12)" stroke-width="2">
        <!-- Head -->
        <ellipse cx="0" cy="-260" rx="55" ry="65" fill="url(#bodyGrad)"/>
        <!-- Jaw -->
        <ellipse cx="0" cy="-200" rx="38" ry="22" fill="url(#bodyGrad)"/>
        <!-- Neck -->
        <rect x="-22" y="-175" width="44" height="35" rx="10" fill="url(#bodyGrad)"/>
        <!-- Torso (chest) -->
        <path d="M -130 -140 L 130 -140 L 145 80 L -145 80 Z" fill="url(#bodyGrad)"/>
        <!-- Hips -->
        <path d="M -145 80 L 145 80 L 130 130 L -130 130 Z" fill="url(#bodyGrad)"/>
        <!-- Left arm (upper) -->
        <path d="M -130 -130 L -200 100 L -175 130 L -120 -100 Z" fill="url(#bodyGrad)"/>
        <!-- Left forearm -->
        <path d="M -200 100 L -240 280 L -215 295 L -175 130 Z" fill="url(#bodyGrad)"/>
        <!-- Left hand -->
        <ellipse cx="-230" cy="305" rx="22" ry="28" fill="url(#bodyGrad)"/>
        <!-- Right arm (upper) -->
        <path d="M 130 -130 L 200 100 L 175 130 L 120 -100 Z" fill="url(#bodyGrad)"/>
        <!-- Right forearm -->
        <path d="M 200 100 L 240 280 L 215 295 L 175 130 Z" fill="url(#bodyGrad)"/>
        <!-- Right hand -->
        <ellipse cx="230" cy="305" rx="22" ry="28" fill="url(#bodyGrad)"/>
        <!-- Left leg (thigh) -->
        <path d="M -115 130 L -135 320 L -85 330 L -55 140 Z" fill="url(#bodyGrad)"/>
        <!-- Left calf -->
        <path d="M -135 320 L -125 380 L -75 390 L -85 330 Z" fill="url(#bodyGrad)"/>
        <!-- Left foot -->
        <ellipse cx="-100" cy="395" rx="38" ry="14" fill="url(#bodyGrad)"/>
        <!-- Right leg (thigh) -->
        <path d="M 115 130 L 135 320 L 85 330 L 55 140 Z" fill="url(#bodyGrad)"/>
        <!-- Right calf -->
        <path d="M 135 320 L 125 380 L 75 390 L 85 330 Z" fill="url(#bodyGrad)"/>
        <!-- Right foot -->
        <ellipse cx="100" cy="395" rx="38" ry="14" fill="url(#bodyGrad)"/>
    </g>

    <!-- ───── MARKERS (pulsing red dots) ───── -->
    <g filter="url(#glow)">
        <!-- Marker 1: left shoulder -->
        <g transform="translate(700, 360)">
            <circle r="20" fill="#ef4444" opacity="0.25">
                <animate attributeName="r" values="14;24;14" dur="2.2s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.4;0;0.4" dur="2.2s" repeatCount="indefinite"/>
            </circle>
            <circle r="9" fill="#ef4444"/>
            <circle r="4" fill="#fee2e2"/>
        </g>

        <!-- Marker 2: right forearm -->
        <g transform="translate(990, 600)">
            <circle r="20" fill="#ef4444" opacity="0.25">
                <animate attributeName="r" values="14;24;14" dur="2.7s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.4;0;0.4" dur="2.7s" repeatCount="indefinite"/>
            </circle>
            <circle r="9" fill="#ef4444"/>
            <circle r="4" fill="#fee2e2"/>
        </g>

        <!-- Marker 3: chest center -->
        <g transform="translate(810, 420)">
            <circle r="20" fill="#ef4444" opacity="0.25">
                <animate attributeName="r" values="14;24;14" dur="1.9s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.4;0;0.4" dur="1.9s" repeatCount="indefinite"/>
            </circle>
            <circle r="9" fill="#ef4444"/>
            <circle r="4" fill="#fee2e2"/>
        </g>

        <!-- Marker 4: left thigh -->
        <g transform="translate(740, 720)">
            <circle r="20" fill="#ef4444" opacity="0.25">
                <animate attributeName="r" values="14;24;14" dur="2.4s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite"/>
            </circle>
            <circle r="9" fill="#ef4444"/>
            <circle r="4" fill="#fee2e2"/>
        </g>
    </g>

</svg>
