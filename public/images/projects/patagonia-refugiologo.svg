<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#050810"/>
      <stop offset="100%" stop-color="#0D1520"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.48">
      <stop offset="0%"   stop-color="#E08D3C" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#E08D3C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- Eyebrow -->
  <text
    x="800" y="330"
    text-anchor="middle"
    font-family="'SF Mono','Fira Code',monospace"
    font-size="16"
    letter-spacing="8"
    fill="#E08D3C"
    opacity="0.80"
  >PATAGONIA · BARILOCHE</text>

  <!-- Wordmark line 1 -->
  <text
    x="800" y="476"
    text-anchor="middle"
    font-family="Georgia,'Times New Roman',serif"
    font-style="italic"
    font-weight="300"
    font-size="145"
    letter-spacing="-2"
    fill="#F5F0E8"
  >Refugio del Cóndor</text>

  <!-- Ember line -->
  <line x1="380" y1="528" x2="1220" y2="528" stroke="#E08D3C" stroke-width="1.5" opacity="0.60"/>

  <!-- Tagline -->
  <text
    x="800" y="578"
    text-anchor="middle"
    font-family="'Inter','Helvetica Neue',sans-serif"
    font-weight="400"
    font-size="20"
    letter-spacing="10"
    fill="#6B6B6B"
  >MADERA · FUEGO · SILENCIO</text>
</svg>
