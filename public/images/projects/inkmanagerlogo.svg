<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="InkManager">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#ef4444"/>
            <stop offset="100%" stop-color="#7f1d1d"/>
        </linearGradient>
        <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#fca5a5"/>
            <stop offset="100%" stop-color="#ef4444"/>
        </linearGradient>
    </defs>

    <!-- Background rounded square -->
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

    <!-- "I" stem -->
    <path d="M88 64 L88 192" stroke="url(#shine)" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- "M" zig-zag (needle line) -->
    <path d="M120 192 L120 64 L144 112 L168 64 L168 192" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Ink drop -->
    <circle cx="88" cy="216" r="10" fill="#ffffff"/>
</svg>
