<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Fenalix anime streaming frontend preview">
  <defs>
    <linearGradient id="x-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#000000"/>
      <stop offset="60%" stop-color="#0d0008"/>
      <stop offset="100%" stop-color="#1a000c"/>
    </linearGradient>
    <radialGradient id="x-glow" cx="0.35" cy="0.5" r="0.55">
      <stop offset="0%"  stop-color="#e50914" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="x-vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="x-cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#3a1a1a"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="x-cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1a2540"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="x-cardC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#2a1a3a"/>
      <stop offset="100%" stop-color="#100618"/>
    </linearGradient>
    <linearGradient id="x-cardD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#3a3010"/>
      <stop offset="100%" stop-color="#181408"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#x-bg)"/>
  <rect width="1600" height="1000" fill="url(#x-glow)"/>
  <rect width="1600" height="1000" fill="url(#x-vignette)"/>

  <!-- ───── LEFT: Streaming UI grid (Netflix-style) ───── -->
  <g transform="translate(110 130)">

    <!-- Top nav bar -->
    <rect x="0" y="0" width="700" height="44" fill="rgba(0,0,0,0.5)" stroke="rgba(229,9,20,0.3)" stroke-width="1"/>
    <text x="20" y="29" font-family="'Inter',sans-serif" font-weight="900" font-size="18" fill="#e50914" letter-spacing="2">FENALIX</text>
    <g fill="rgba(255,255,255,0.5)" font-family="'Inter',sans-serif" font-size="10">
      <text x="140" y="29">INICIO</text>
      <text x="200" y="29">SERIES</text>
      <text x="260" y="29">PELÍCULAS</text>
      <text x="340" y="29">MI LISTA</text>
    </g>
    <!-- Search icon -->
    <g transform="translate(660 22)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" fill="none">
      <circle cx="0" cy="0" r="6"/>
      <line x1="5" y1="5" x2="12" y2="12"/>
    </g>

    <!-- HERO featured card -->
    <g transform="translate(0 60)">
      <rect x="0" y="0" width="700" height="220" rx="6" fill="url(#x-cardA)" stroke="rgba(229,9,20,0.4)" stroke-width="1.2"/>
      <!-- Featured title -->
      <text x="30" y="80" font-family="'Inter',sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="-1">JUJUTSU KAISEN</text>
      <text x="30" y="105" font-family="'SF Mono',monospace" font-size="10" fill="#e50914" letter-spacing="4">DESTACADO · TEMP. 2</text>
      <!-- Synopsis lines -->
      <line x1="30" y1="125" x2="380" y2="125" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
      <line x1="30" y1="138" x2="320" y2="138" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
      <line x1="30" y1="151" x2="280" y2="151" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
      <!-- Play button -->
      <g transform="translate(30 175)">
        <rect x="0" y="0" width="100" height="32" rx="3" fill="#ffffff"/>
        <polygon points="22,8 22,24 36,16" fill="#000000"/>
        <text x="60" y="22" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="700" font-size="11" fill="#000000" letter-spacing="2">REPRODUCIR</text>
      </g>
      <g transform="translate(140 175)">
        <rect x="0" y="0" width="100" height="32" rx="3" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
        <text x="50" y="22" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="600" font-size="11" fill="#ffffff" letter-spacing="2">+ MI LISTA</text>
      </g>

      <!-- Right side: stylized anime silhouette -->
      <g transform="translate(540 30)" fill="rgba(229,9,20,0.6)" stroke="#ffffff" stroke-width="1">
        <!-- Head -->
        <circle cx="60" cy="40" r="32"/>
        <!-- Spiky hair -->
        <polygon points="28,30 32,5 42,22 50,0 60,18 70,0 78,22 88,5 92,30 60,28"/>
        <!-- Body -->
        <path d="M 30 75 L 90 75 L 95 170 L 25 170 Z"/>
        <!-- Eye glow -->
        <circle cx="50" cy="42" r="3" fill="#e50914"/>
        <circle cx="70" cy="42" r="3" fill="#e50914"/>
      </g>
    </g>

    <!-- Category row label -->
    <text x="0" y="305" font-family="'Inter',sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="2">CONTINUAR VIENDO</text>

    <!-- Cards row 1 (4 small cards) -->
    <g transform="translate(0 320)">
      <g>
        <rect x="0" y="0" width="160" height="100" rx="4" fill="url(#x-cardA)" stroke="rgba(255,255,255,0.1)"/>
        <text x="80" y="55" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="700" font-size="11" fill="#ffffff">DEMON SLAYER</text>
        <!-- Progress bar -->
        <rect x="8" y="88" width="144" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
        <rect x="8" y="88" width="98" height="3" rx="1.5" fill="#e50914"/>
      </g>
      <g transform="translate(178 0)">
        <rect x="0" y="0" width="160" height="100" rx="4" fill="url(#x-cardB)" stroke="rgba(255,255,255,0.1)"/>
        <text x="80" y="55" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="700" font-size="11" fill="#ffffff">MUSHOKU TENSEI</text>
        <rect x="8" y="88" width="144" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
        <rect x="8" y="88" width="60" height="3" rx="1.5" fill="#e50914"/>
      </g>
      <g transform="translate(356 0)">
        <rect x="0" y="0" width="160" height="100" rx="4" fill="url(#x-cardC)" stroke="rgba(255,255,255,0.1)"/>
        <text x="80" y="55" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="700" font-size="11" fill="#ffffff">ATTACK ON TITAN</text>
        <rect x="8" y="88" width="144" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
        <rect x="8" y="88" width="130" height="3" rx="1.5" fill="#e50914"/>
      </g>
      <g transform="translate(534 0)">
        <rect x="0" y="0" width="160" height="100" rx="4" fill="url(#x-cardD)" stroke="rgba(255,255,255,0.1)"/>
        <text x="80" y="55" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="700" font-size="11" fill="#ffffff">ONE PUNCH</text>
        <rect x="8" y="88" width="144" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
        <rect x="8" y="88" width="38" height="3" rx="1.5" fill="#e50914"/>
      </g>
    </g>

    <!-- Category row 2 label -->
    <text x="0" y="465" font-family="'Inter',sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="2">POPULARES AHORA</text>

    <!-- Cards row 2 -->
    <g transform="translate(0 480)">
      <g>
        <rect x="0" y="0" width="160" height="100" rx="4" fill="url(#x-cardB)" stroke="rgba(255,255,255,0.1)"/>
        <text x="80" y="55" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="700" font-size="11" fill="#ffffff">SPY × FAMILY</text>
        <text x="8" y="22" font-family="'SF Mono',monospace" font-size="8" fill="#e50914" font-weight="700">#1</text>
      </g>
      <g transform="translate(178 0)">
        <rect x="0" y="0" width="160" height="100" rx="4" fill="url(#x-cardC)" stroke="rgba(255,255,255,0.1)"/>
        <text x="80" y="55" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="700" font-size="11" fill="#ffffff">CHAINSAW MAN</text>
        <text x="8" y="22" font-family="'SF Mono',monospace" font-size="8" fill="#e50914" font-weight="700">#2</text>
      </g>
      <g transform="translate(356 0)">
        <rect x="0" y="0" width="160" height="100" rx="4" fill="url(#x-cardA)" stroke="rgba(255,255,255,0.1)"/>
        <text x="80" y="55" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="700" font-size="11" fill="#ffffff">VINLAND SAGA</text>
        <text x="8" y="22" font-family="'SF Mono',monospace" font-size="8" fill="#e50914" font-weight="700">#3</text>
      </g>
      <g transform="translate(534 0)">
        <rect x="0" y="0" width="160" height="100" rx="4" fill="url(#x-cardD)" stroke="rgba(255,255,255,0.1)"/>
        <text x="80" y="55" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="700" font-size="11" fill="#ffffff">FRIEREN</text>
        <text x="8" y="22" font-family="'SF Mono',monospace" font-size="8" fill="#e50914" font-weight="700">#4</text>
      </g>
    </g>

    <!-- Big play button overlay center-right -->
    <g transform="translate(580 200)" opacity="0.85">
      <circle cx="0" cy="0" r="42" fill="rgba(229,9,20,0.92)" stroke="#ffffff" stroke-width="2"/>
      <polygon points="-12,-16 -12,16 18,0" fill="#ffffff"/>
    </g>
  </g>

  <!-- ───── RIGHT PANEL ───── -->

  <text x="1480" y="510" text-anchor="end" font-family="'Inter','Helvetica Neue',sans-serif" font-weight="900" font-size="190" letter-spacing="-5" fill="#ffffff">FENALIX</text>

  <circle cx="1480" cy="474" r="16" fill="#e50914"/>

  <line x1="830" y1="555" x2="1480" y2="555" stroke="#e50914" stroke-width="1.5" opacity="0.55"/>
  <text x="1480" y="595" text-anchor="end" font-family="'Inter','Helvetica Neue',sans-serif" font-weight="600" font-size="22" letter-spacing="8" fill="#ff7a82">ANIME STREAMING UI</text>



  <!-- Corner brackets -->
  <g stroke="#e50914" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 40 40 L 80 40 M 40 40 L 40 80"/>
    <path d="M 1560 40 L 1520 40 M 1560 40 L 1560 80"/>
    <path d="M 40 960 L 80 960 M 40 960 L 40 920"/>
    <path d="M 1560 960 L 1520 960 M 1560 960 L 1560 920"/>
  </g>
</svg>
