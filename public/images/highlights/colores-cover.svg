<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#080808"/>

  <!-- Glow -->
  <circle cx="540" cy="540" r="300" fill="#38bdf8" opacity="0.05"/>

  <!-- Color dots — arranged in a balanced triangle -->
  <!-- Top center: celeste (AMF accent) -->
  <circle cx="540" cy="330" r="130" fill="#38bdf8"/>

  <!-- Bottom left: purple -->
  <circle cx="355" cy="660" r="130" fill="#a78bfa"/>

  <!-- Bottom right: warm white/cream -->
  <circle cx="725" cy="660" r="130" fill="#f5f5f7"/>

  <!-- Center overlap dot — dark, ties them together -->
  <circle cx="540" cy="555" r="52" fill="#080808" opacity="0.85"/>
</svg>
